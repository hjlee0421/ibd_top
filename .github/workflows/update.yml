name: Daily IBD Scraper

on:
  schedule:
    # 한국 시간(KST) 매일 오전 6시 30분 = UTC 기준 매일 21시 30분
    - cron: '30 21 * * *'
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 저장소 소스코드 가져오기
        uses: actions/checkout@v4
        
      - name: 파이썬 3.10 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 리눅스용 구글 크롬 설치
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor --yes -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
      - name: 필수 파이썬 패키지 설치
        run: pip install -r requirements.txt
        
      - name: 스크래핑 파이썬 스크립트 실행
        run: python scraper.py

      - name: 마지막 업데이트 시각 기록
        run: date -u '+%Y-%m-%dT%H:%M:%SZ' > last_updated.txt
        
      - name: 변경된 엑셀 파일 자동 커밋 및 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update IBD rankings"
          file_pattern: "*.xlsx last_updated.txt"
